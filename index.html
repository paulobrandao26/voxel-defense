<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Tower defense voxel: defenda o castelo com torres de flecha, canhão e gelo.">
<title>Voxel Defense</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--card:rgba(20,28,40,.92);--txt:#f4f1e8;--muted:#a9b4c2;--gold:#ffc93c;--pri:#ffb627;--r:14px;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);background:linear-gradient(#7ec4ee,#d6eefc 70%);
font:600 15px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:none}
.pill{background:var(--card);border-radius:999px;padding:6px 12px;display:flex;gap:6px;align-items:center;min-height:34px;box-shadow:0 2px 8px #0004}
.pill b{font-variant-numeric:tabular-nums}
.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
#bar{position:fixed;left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);bottom:calc(var(--sab) + 10px);display:flex;gap:8px;justify-content:center;pointer-events:none}
#bar>*{pointer-events:auto}
body.sheet-open #bar{visibility:hidden}
button{font:inherit;border:0;border-radius:var(--r);min-height:48px;min-width:48px;cursor:pointer;color:var(--txt);background:#33445a;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--pri);color:#2a1a00;font-size:17px;padding:0 20px;box-shadow:0 4px 0 #b37400,0 6px 14px #0006}
.pri:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #b37400}
.sec{background:var(--card);padding:0 14px}
#wave{flex:1;max-width:340px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding:12px calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px);
background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #0007;transform:translateY(110%);transition:transform .18s ease-out}
#sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-head h2{margin:0;font-size:17px}
.x{background:transparent;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:#2a3a4e;min-height:112px}
.sw{width:34px;height:34px;border-radius:8px;box-shadow:inset 0 -6px 0 #0003}
.card small{color:var(--muted);font-weight:500;font-size:12px}
.price{color:var(--gold)}
.card:disabled .price{color:#ff8a80}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.stats{color:var(--muted);font-weight:500;font-size:14px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 56px);transform:translateX(-50%);background:var(--card);padding:10px 16px;border-radius:12px;width:max-content;max-width:min(90vw,420px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0009;padding:20px}
#over.show{display:flex}
@media (orientation:landscape) and (max-height:520px){
  #hud{right:auto;flex-direction:column;align-items:flex-start}
  #bar{left:auto;flex-direction:column-reverse;align-items:stretch;width:180px}
  #wave{flex:none;min-height:56px;font-size:15px;padding:0 12px}
}
.box{background:var(--card);border-radius:20px;padding:24px;text-align:center;max-width:340px;width:100%}
.box h1{margin:0 0 8px;font-size:26px}
.box p{margin:6px 0;color:var(--muted)}
.box .pri{width:100%;margin-top:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill" title="Ouro">🪙 <b id="gold">0</b></div>
  <div class="pill" title="Vida do castelo">❤️ <b id="lives">20</b></div>
  <div class="pill" title="Onda atual">Onda <b id="waveN">0</b></div>
  <div class="pill" title="Recorde de onda">🏆 <b id="best">0</b></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="bar">
  <button id="speed" class="sec" aria-label="Velocidade do jogo">1x</button>
  <button id="wave" class="pri">▶ Começar onda 1</button>
</div>
<div id="sheet" role="dialog" aria-label="Menu da torre"></div>
<div id="over">
  <div class="box">
    <h1>O castelo caiu!</h1>
    <p>Você chegou à onda <b id="ovWave">0</b></p>
    <p id="ovNew" hidden>🏆 Novo recorde!</p>
    <p>Recorde: onda <b id="ovBest">0</b></p>
    <button id="again" class="pri">Jogar de novo</button>
  </div>
</div>
<script>
addEventListener('error', () => {
  const t = document.getElementById('toast');
  t.textContent = 'Não foi possível carregar o jogo. Confira a internet e recarregue a página.';
  t.classList.add('show');
});
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (() => { let s = 7; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

// ===== Mapa =====
const W = 12, H = 20;
const wx = i => i - W / 2 + .5, wz = j => j - H / 2 + .5;
const key = (i, j) => i + ',' + j;
const GRASS = 0, PATH = 1, WATER = 2, BRIDGE = 3, CASTLE = 4, DECOR = 5;
const grid = [...Array(W)].map(() => Array(H).fill(GRASS));
const inMap = (i, j) => i >= 0 && j >= 0 && i < W && j < H;
const PATH_PTS = [[2, -.8], [2, 4], [9, 4], [9, 8], [3, 8], [3, 13], [8, 13], [8, 17]];

for (let k = 0; k < PATH_PTS.length - 1; k++) {
  let [i, j] = PATH_PTS[k].map(Math.round); const [i1, j1] = PATH_PTS[k + 1].map(Math.round);
  const di = Math.sign(i1 - i), dj = Math.sign(j1 - j);
  for (;;) { if (inMap(i, j)) grid[i][j] = PATH; if (i === i1 && j === j1) break; i += di; j += dj; }
}
for (let i = 0; i < W; i++) for (const j of i <= 5 ? [11] : i === 6 ? [10, 11] : [10]) grid[i][j] = grid[i][j] === PATH ? BRIDGE : WATER;
for (let i = 7; i <= 9; i++) for (let j = 17; j < H; j++) grid[i][j] = CASTLE;

const buildable = [];
for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) {
  if (grid[i][j] !== GRASS) continue;
  let near = false;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const t = inMap(i + a, j + b) && grid[i + a][j + b]; if (t === PATH || t === BRIDGE) near = true; }
  if (near) buildable.push([i, j]);
}
const isBuildable = new Set(buildable.map(([i, j]) => key(i, j)));
const trees = [], rocks = [];
for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) {
  if (grid[i][j] !== GRASS || isBuildable.has(key(i, j))) continue;
  const r = rnd();
  if (r < .4) { grid[i][j] = DECOR; trees.push([i, j]); } else if (r < .5) { grid[i][j] = DECOR; rocks.push([i, j]); }
}

const PW = PATH_PTS.map(([i, j]) => V(wx(i), 0, wz(j)));
const SEG = []; let PATH_LEN = 0;
for (let k = 0; k < PW.length - 1; k++) { const len = PW[k].distanceTo(PW[k + 1]); SEG.push({ a: PW[k], b: PW[k + 1], len, start: PATH_LEN }); PATH_LEN += len; }
const segAt = d => SEG.find(s => d <= s.start + s.len) || SEG[SEG.length - 1];
function pathAt(d, out) { const s = segAt(d); return out.lerpVectors(s.a, s.b, clamp((d - s.start) / s.len, 0, 1)); }

// ===== Cena =====
const canvas = $('c');
const dpr = Math.min(devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: dpr < 1.5, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(dpr);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, .5, 150);
scene.add(new THREE.HemisphereLight(0xe2f2ff, 0x5a6b3a, 1.7));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.3);
sun.position.set(-7, 14, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 13, bottom: -13, near: 1, far: 40 });
sun.shadow.bias = -.0008; sun.shadow.normalBias = .02;
scene.add(sun);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const M = (c, e) => new THREE.MeshLambertMaterial(e ? { color: c, emissive: e } : { color: c });
const mat = {
  stone: M(0xbdb8ae), stoneD: M(0x8f8a80), wood: M(0xa0703f), woodD: M(0x6e4a2a), red: M(0xd0453a), dark: M(0x2a2a33),
  white: M(0xffffff), black: M(0x151515), gold: M(0xffc93c, 0x553300), iron: M(0x4a525c), snow: M(0xe6f6ff),
  ice: M(0x9fe6ff, 0x2a8fc0), soil: M(0x7a5233), soilD: M(0x553823), tint: M(0xffffff),
};
function box(m, sx, sy, sz, x, y, z, p) {
  const o = new THREE.Mesh(BOX, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true; p && p.add(o); return o;
}
const CONE = new THREE.ConeGeometry(1, 1, 4).rotateY(Math.PI / 4);
function cone(m, r, h, x, y, z, p) { const o = new THREE.Mesh(CONE, m); o.scale.set(r, h, r); o.position.set(x, y, z); o.castShadow = true; p.add(o); return o; }

const dummy = new THREE.Object3D(), col = new THREE.Color();
function setInst(mesh, n, x, y, z, sx, sy, sz, ry = 0) {
  dummy.position.set(x, y, z); dummy.rotation.set(0, ry, 0); dummy.scale.set(sx, sy, sz); dummy.updateMatrix();
  mesh.setMatrixAt(n, dummy.matrix);
}

// Chão (um InstancedMesh para tudo que não é água)
const solid = [], water = [];
for (let i = 0; i < W; i++) for (let j = 0; j < H; j++) (grid[i][j] === WATER || grid[i][j] === BRIDGE ? water : solid).push([i, j]);
const ground = new THREE.InstancedMesh(BOX, mat.tint, solid.length);
solid.forEach(([i, j], n) => {
  const p = grid[i][j] === PATH, top = p ? -.07 : 0;
  setInst(ground, n, wx(i), top - .5, wz(j), 1, 1, 1);
  ground.setColorAt(n, p ? col.setHSL(.09, .42, .56 + rnd() * .05) : col.setHSL(.26 + rnd() * .03, .5, .42 + rnd() * .06));
});
ground.receiveShadow = true; scene.add(ground);
const waterMesh = new THREE.InstancedMesh(BOX, M(0xffffff), water.length);
water.forEach(([i, j], n) => { setInst(waterMesh, n, wx(i), -.8, wz(j), 1, 1, 1); waterMesh.setColorAt(n, col.setHSL(.56, .65, .5 + rnd() * .06)); });
waterMesh.receiveShadow = true; scene.add(waterMesh);
box(mat.soil, W, 1.2, H, 0, -1.6, 0, scene);
box(mat.soilD, W - .4, .8, H - .4, 0, -2.6, 0, scene);

// Ponte
for (const [i, j] of water) if (grid[i][j] === BRIDGE) {
  for (let k = 0; k < 5; k++) box(mat.wood, 1.15, .08, .16, wx(i), .0, wz(j) - .4 + k * .2, scene);
  for (const s of [-1, 1]) box(mat.woodD, .08, .25, 1.15, wx(i) + s * .56, .14, wz(j), scene);
}

// Árvores e pedras
const trunk = new THREE.InstancedMesh(BOX, M(0x7a5230), trees.length);
const leafA = new THREE.InstancedMesh(BOX, M(0xffffff), trees.length), leafB = new THREE.InstancedMesh(BOX, M(0xffffff), trees.length);
trees.forEach(([i, j], n) => {
  const x = wx(i) + (rnd() - .5) * .3, z = wz(j) + (rnd() - .5) * .3, s = .8 + rnd() * .4, r = rnd() * 1.5;
  setInst(trunk, n, x, .25 * s, z, .18 * s, .5 * s, .18 * s, r);
  setInst(leafA, n, x, .72 * s, z, .72 * s, .55 * s, .72 * s, r);
  setInst(leafB, n, x, 1.12 * s, z, .45 * s, .35 * s, .45 * s, r);
  leafA.setColorAt(n, col.setHSL(.3 + rnd() * .05, .55, .3 + rnd() * .06));
  leafB.setColorAt(n, col.setHSL(.3 + rnd() * .05, .55, .38 + rnd() * .06));
});
const rockMesh = new THREE.InstancedMesh(BOX, M(0xffffff), rocks.length * 2);
rocks.forEach(([i, j], n) => {
  for (let k = 0; k < 2; k++) {
    const s = k ? .6 : 1;
    setInst(rockMesh, n * 2 + k, wx(i) + (rnd() - .5) * .4, .15 * s, wz(j) + (rnd() - .5) * .4, (.4 + rnd() * .3) * s, (.3 + rnd() * .15) * s, (.4 + rnd() * .3) * s, rnd() * 3);
    rockMesh.setColorAt(n * 2 + k, col.setHSL(.1, .04, .5 + rnd() * .12));
  }
});
for (const m of [trunk, leafA, leafB, rockMesh]) { m.castShadow = m.receiveShadow = true; scene.add(m); }

// Castelo
const castle = new THREE.Group(); const CX = wx(8), CZ = wz(18);
castle.position.set(CX, 0, CZ); scene.add(castle);
box(mat.stone, 2.6, 1.1, 2.5, 0, .55, 0, castle);
for (let k = -1.1; k <= 1.11; k += .44) {
  box(mat.stone, .22, .22, .22, k, 1.21, -1.15, castle); box(mat.stone, .22, .22, .22, k, 1.21, 1.15, castle);
  box(mat.stone, .22, .22, .22, -1.2, 1.21, k, castle); box(mat.stone, .22, .22, .22, 1.2, 1.21, k, castle);
}
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { box(mat.stoneD, .7, 1.8, .7, sx * 1.25, .9, sz * 1.2, castle); cone(mat.red, .55, .6, sx * 1.25, 2.1, sz * 1.2, castle); }
box(mat.stone, 1.1, 2.2, 1.1, 0, 1.1, .2, castle); cone(mat.red, .85, .8, 0, 2.6, .2, castle);
box(mat.dark, .6, .7, .1, 0, .35, -1.27, castle);
box(mat.woodD, .05, .9, .05, 0, 3.3, .2, castle);
const flag = new THREE.Group(); flag.position.set(0, 3.6, .2); castle.add(flag); box(mat.red, .45, .26, .04, .23, 0, 0, flag);
let castleShake = 0;

// Portal de onde saem os inimigos
{ const x = wx(2), z = wz(0) - .45;
  for (const s of [-1, 1]) box(mat.stoneD, .3, 1.2, .3, x + s * .6, .6, z, scene);
  box(mat.stoneD, 1.5, .3, .35, x, 1.3, z, scene); box(mat.dark, .9, 1.1, .05, x, .55, z - .12, scene); }

// Marcadores de onde dá para construir
const markGeo = new THREE.PlaneGeometry(.8, .8).rotateX(-Math.PI / 2);
const marks = new THREE.InstancedMesh(markGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, depthWrite: false }), buildable.length);
const markIdx = new Map(buildable.map(([i, j], n) => [key(i, j), n]));
function setMark(n, on) { const [i, j] = buildable[n]; setInst(marks, n, wx(i), .015, wz(j), on ? 1 : 0, 1, on ? 1 : 0); marks.instanceMatrix.needsUpdate = true; }
buildable.forEach((_, n) => setMark(n, true)); scene.add(marks);

// Seleção: anel de alcance e cursor
const basic = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, depthWrite: false });
const rangeG = new THREE.Group();
rangeG.add(new THREE.Mesh(new THREE.RingGeometry(.95, 1, 48).rotateX(-Math.PI / 2), basic(0xffffff, .85)));
rangeG.add(new THREE.Mesh(new THREE.CircleGeometry(1, 48).rotateX(-Math.PI / 2), basic(0xffffff, .12)));
rangeG.visible = false; scene.add(rangeG);
const cursor = new THREE.Mesh(new THREE.PlaneGeometry(.92, .92).rotateX(-Math.PI / 2), basic(0xffd54a, .65));
cursor.visible = false; scene.add(cursor);

// Partículas (cubinhos)
const PMAX = 400;
const pm = new THREE.InstancedMesh(BOX, M(0xffffff), PMAX); pm.frustumCulled = false; pm.castShadow = true; scene.add(pm);
const P = [...Array(PMAX)].map(() => ({ p: V(), v: V(), life: 0, s: 0, r: 0 }));
P.forEach((_, n) => { setInst(pm, n, 0, -9, 0, 0, 0, 0); pm.setColorAt(n, col.set(0xffffff)); });
let pi = 0;
function burst(pos, color, n, spd, size) {
  for (let k = 0; k < n; k++) {
    const q = P[pi];
    q.p.copy(pos); q.v.set((Math.random() - .5) * 2 * spd, Math.random() * spd * 1.2 + 1, (Math.random() - .5) * 2 * spd);
    q.life = .6 + Math.random() * .5; q.s = size * (.6 + Math.random() * .6); q.r = Math.random() * 6;
    pm.setColorAt(pi, col.set(color).offsetHSL(0, 0, (Math.random() - .5) * .15));
    pi = (pi + 1) % PMAX;
  }
  pm.instanceColor.needsUpdate = true;
}
function updateParticles(dt) {
  for (let n = 0; n < PMAX; n++) {
    const q = P[n]; if (q.life <= 0) continue;
    q.life -= dt; q.v.y -= 9.8 * dt; q.p.addScaledVector(q.v, dt);
    if (q.p.y < .05) { q.p.y = .05; q.v.y *= -.35; q.v.x *= .7; q.v.z *= .7; }
    const s = q.life > 0 ? q.s * Math.min(1, q.life / .35) : 0;
    dummy.position.copy(q.p); dummy.rotation.set(q.r, q.r * 1.3, 0); dummy.scale.setScalar(s); dummy.updateMatrix();
    pm.setMatrixAt(n, dummy.matrix);
  }
  pm.instanceMatrix.needsUpdate = true;
}

// Moedas
const COIN = new THREE.CylinderGeometry(.16, .16, .05, 12).rotateX(Math.PI / 2);
const coins = [];
function dropCoin(p) { const m = new THREE.Mesh(COIN, mat.gold); m.position.set(p.x, .5, p.z); scene.add(m); coins.push({ m, t: 0 }); }

// ===== Inimigos =====
const ETYPES = {
  rapido: { hp: 28, speed: 1.7, reward: 5, size: .42, color: 0xe8553d, dmg: 1, hdps: 6 },
  tanque: { hp: 120, speed: .75, reward: 12, size: .72, color: 0x7d5ba6, dmg: 2, hdps: 12 },
  chefe: { hp: 650, speed: .5, reward: 80, size: 1.1, color: 0x3a3f55, dmg: 5, hdps: 30 },
};
for (const T of Object.values(ETYPES)) T.dmat = M(new THREE.Color(T.color).multiplyScalar(.55).getHex());
const BAR = new THREE.PlaneGeometry(1, 1);
const barBg = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, depthTest: false, transparent: true });
const barCols = [0x4ade80, 0xfacc15, 0xef4444].map(c => new THREE.MeshBasicMaterial({ color: c, depthTest: false, transparent: true }));
const enemies = [];

function spawnEnemy(type) {
  const T = ETYPES[type], s = T.size, g = new THREE.Group(), inner = new THREE.Group();
  g.add(inner);
  const body = M(T.color, 0x000000);
  box(body, s, s * .8, s, 0, s * .5 + .1, 0, inner);
  box(T.dmat, s * 1.04, s * .22, s * 1.04, 0, s * .86 + .1, 0, inner);
  const eye = type === 'chefe' ? mat.red : mat.white;
  for (const sx of [-1, 1]) {
    box(eye, s * .22, s * .2, .04, sx * s * .22, s * .58 + .1, s / 2 + .01, inner);
    box(mat.black, s * .1, s * .1, .03, sx * s * .22, s * .56 + .1, s / 2 + .035, inner);
  }
  const f1 = box(T.dmat, s * .25, .12, s * .3, -s * .25, .06, 0, g), f2 = box(T.dmat, s * .25, .12, s * .3, s * .25, .06, 0, g);
  if (type === 'tanque') for (const sx of [-1, 1]) box(mat.stoneD, s * .3, s * .25, s * .55, sx * s * .6, s * .72, 0, inner);

    const arrow = (a, b) => b !== undefined && b !== a ? `${a} → ${b}` : `${a}`;
    h = `<div class="sh-head"><h2>Torre de ${t.T.name.toLowerCase()} · nível ${t.lv + 1} de 3</h2>${close}</div>
      <div class="stats">Dano ${arrow(st.dmg, nx?.dmg)} · Alcance ${arrow(st.range, nx?.range)}${st.splash ? ' · Área ' + arrow(st.splash, nx?.splash) : ''}${st.slow ? ` · Lentidão ${arrow(Math.round((1 - st.slow) * 100), nx && Math.round((1 - nx.slow) * 100))}%` : ''}</div>
      <div class="row"><button class="pri" data-a="up" ${ok ? '' : 'disabled'}>${max ? 'Nível máximo' : `Melhorar 🪙 ${upc}`}</button>
      <button class="sec" data-a="sell">Vender +🪙 ${Math.floor(t.inv * .6)}</button></div>
      ${!max && !ok ? '<div class="stats" style="margin-top:6px">Ouro insuficiente para melhorar. Vença mais inimigos.</div>' : ''}`;
  }
  if (sig === sheetSig) return;
  sheetSig = sig; $('sheet').innerHTML = h;
}
function openSheet(p) {
  sheetSig = ''; renderSheet();
  $('sheet').classList.add('open'); document.body.classList.add('sheet-open');
  ensureVisible(p);
}
function openBuild(i, j) { S.sel = { k: 'b', i, j }; cursor.position.set(wx(i), .02, wz(j)); cursor.visible = true; rangeG.visible = false; openSheet(V(wx(i), 0, wz(j))); }
function openTower(t) {
  S.sel = { k: 't', t }; cursor.visible = false;
  rangeG.position.set(t.pos.x, .03, t.pos.z); rangeG.scale.setScalar(t.T.lv[t.lv].range); rangeG.visible = true;
  openSheet(t.pos);
}
function closeSheet() {
  S.sel = null; cursor.visible = rangeG.visible = false;
  $('sheet').classList.remove('open'); document.body.classList.remove('sheet-open');
}
$('sheet').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.a, sel = S.sel;
  if (a === 'close') closeSheet();
  else if (a === 'build') placeTower(b.dataset.t, sel.i, sel.j);
  else if (a === 'up') upgradeTower(sel.t);
  else if (a === 'sell') sellTower(sel.t);
});
$('wave').onclick = startWave;
$('speed').onclick = () => { S.speed = S.speed === 1 ? 2 : 1; $('speed').textContent = S.speed + 'x'; };
$('again').onclick = resetGame;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); if (e.key === ' ' && !S.sel) { e.preventDefault(); startWave(); } });

// ===== Câmera e toque =====
const C = { tx: 0, tz: .5, dist: 30, pitch: .95, goal: null };
const MIN = 7, MAX = 45;
function updateCam() {
  cam.position.set(C.tx, Math.sin(C.pitch) * C.dist, C.tz + Math.cos(C.pitch) * C.dist);
  cam.lookAt(C.tx, 0, C.tz);
  cam.updateMatrixWorld();
}
function clampCam() { C.tx = clamp(C.tx, -W / 2, W / 2); C.tz = clamp(C.tz, -H / 2, H / 2 + 4); }
function fitDist() { const t = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)), a = innerWidth / innerHeight; return clamp(Math.max(12.5 / (t * a), 23 / t), MIN, MAX); }
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  C.dist = fitDist(); updateCam();
}
addEventListener('resize', resize);
// Se a casa escolhida ficar atrás do menu, a câmera desliza um pouco para mostrá-la.
function ensureVisible(p) {
  const limit = innerHeight - $('sheet').offsetHeight - 40, orig = C.tz, sy = () => (-tmp.copy(p).project(cam).y + 1) / 2 * innerHeight;
  if (sy() <= limit) return;
  let tz = orig;
  for (let k = 0; k < 40 && sy() > limit; k++) { tz += .25; C.tz = tz; updateCam(); }
  C.tz = orig; updateCam(); C.goal = Math.min(tz, H / 2 + 4);
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(V(0, 1, 0), 0), va = V(), vb = V();
function setRay(x, y) { ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam); }
function groundAt(x, y, out) { setRay(x, y); return ray.ray.intersectPlane(plane, out); }
const ptrs = new Map(); let drag = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { sx: e.clientX, sy: e.clientY, moved: false };
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; drag = { pinch: true, moved: true, d0: Math.hypot(a.x - b.x, a.y - b.y), dist0: C.dist }; }
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || !drag) return;
  const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY;
  if (drag.pinch) {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()];
    C.dist = clamp(drag.dist0 * drag.d0 / Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), MIN, MAX); updateCam(); return;
  }
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  if (!drag.moved) return;
  const a = groundAt(px, py, va), b = groundAt(e.clientX, e.clientY, vb);
  if (a && b) { C.tx += a.x - b.x; C.tz += a.z - b.z; C.goal = null; clampCam(); updateCam(); }
});
function pointerEnd(e) {
  if (!ptrs.delete(e.pointerId) || !drag) return;
  if (!drag.pinch && !drag.moved && e.type === 'pointerup') onTap(e.clientX, e.clientY);
  if (!ptrs.size) drag = null;
  else if (drag.pinch) { const [p] = [...ptrs.values()]; drag = { sx: p.x, sy: p.y, moved: true }; }
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('wheel', e => { e.preventDefault(); C.dist = clamp(C.dist * Math.exp(e.deltaY * .001), MIN, MAX); updateCam(); }, { passive: false });

function onTap(x, y) {
  if (S.over) return;
  const wasOpen = !!S.sel;
  setRay(x, y);
  const hitT = ray.intersectObjects(towers.map(t => t.root), true)[0];
  if (hitT) { let o = hitT.object; while (o && !o.userData.tower) o = o.parent; if (o) return openTower(o.userData.tower); }
  const p = groundAt(x, y, va);
  if (p) {
    const ci = Math.floor(p.x + W / 2), cj = Math.floor(p.z + H / 2), cell = inMap(ci, cj) ? grid[ci][cj] : -1;
    const t = towerAt.get(key(ci, cj));
    if (t) return openTower(t);
    if (cell === PATH || cell === BRIDGE) { closeSheet(); return moveHero(p); }
    let best = null, bd = .81;
    for (const [i, j] of buildable) {
      if (towerAt.has(key(i, j))) continue;
      const d = (wx(i) - p.x) ** 2 + (wz(j) - p.z) ** 2;
      if (d < bd) { bd = d; best = [i, j]; }
    }
    if (best) return openBuild(...best);
    if (cell === GRASS || cell === DECOR) { closeSheet(); return moveHero(p); }
  }
  closeSheet();
  if (!wasOpen) toast('Construa nos quadrados claros. Toque na estrada para mover o herói.');
}

// ===== Loop =====
let last = performance.now(), time = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const rdt = Math.min(.05, (now - last) / 1000); last = now; time += rdt;
  const dt = S.over ? 0 : rdt * S.speed;
  updateWave(dt); updateEnemies(dt, time); updateTowers(dt, rdt, time); updateHero(dt, rdt); updateShots(dt); updateParticles(rdt);
  for (let k = coins.length - 1; k >= 0; k--) {
    const c = coins[k]; c.t += rdt;
    c.m.position.y = .5 + Math.sin(Math.min(c.t, .5) / .5 * Math.PI / 2) * .9; c.m.rotation.y += rdt * 10;
    if (c.t > .5) c.m.scale.setScalar(Math.max(0, 1 - (c.t - .5) / .35));
    if (c.t > .85) { scene.remove(c.m); coins.splice(k, 1); }
  }
  water.forEach(([i, j], n) => setInst(waterMesh, n, wx(i), -.8 + Math.sin(time * 2 + i * .7 + j) * .03, wz(j), 1, 1, 1));
  waterMesh.instanceMatrix.needsUpdate = true;
  flag.rotation.y = Math.sin(time * 3) * .35;
  castleShake = Math.max(0, castleShake - rdt);
  castle.position.x = CX + Math.sin(time * 70) * .06 * castleShake;
  if (C.goal !== null) { C.tz += (C.goal - C.tz) * Math.min(1, rdt * 8); if (Math.abs(C.goal - C.tz) < .01) C.goal = null; updateCam(); }
  renderer.render(scene, cam);
}
resize(); updateUI();
toast('Toque num quadrado claro para construir torres. Toque na estrada para mover o herói azul.', 6000);
requestAnimationFrame(loop);
</script>
</body>
